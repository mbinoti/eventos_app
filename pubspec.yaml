name: eventos_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  smooth_page_indicator: ^1.2.1
  cloud_firestore: ^6.5.0
  device_info_plus: ^11.5.0
  firebase_storage: ^13.4.2
  flutter_local_notifications: ^19.4.0
  equatable: ^2.0.7
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  share_plus: ^12.0.2
  http: ^1.6.0
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

flutter:
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/RobotoVariable.ttf
        - asset: assets/fonts/roboto/RobotoItalicVariable.ttf
          style: italic

    - family: EduNSWACTHand
      fonts:
        - asset: assets/fonts/edu/EduNSWACTHandPre-VariableFont_wght.ttf
